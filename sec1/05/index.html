<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>درس كاد وأخواتها - الصف الأول الثانوي</title>
    <!-- استدعاء خط احترافي -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #134e4a;      
            --primary-light: #0d9488; 
            --secondary: #0e7490;    
            --success: #10b981;      
            --danger: #ef4444;       
            --warning: #f59e0b;      
            --dark: #1e293b;         
            --light: #f8fafc;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            font-family: 'Cairo', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #ecfeff;
            background-image: radial-gradient(#a5d4ce 1.5px, transparent 1.5px);
            background-size: 25px 25px;
            color: var(--dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .hidden { display: none !important; }
        
        /* --- الهيدر الرئيسي --- */
        .header-main {
            background: linear-gradient(135deg, #042f2e, var(--primary), var(--secondary));
            color: white;
            padding: 30px 20px 90px 20px; 
            text-align: center;
            position: relative;
            margin-bottom: 20px;
        }

        .header-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title-line1 {
            font-size: clamp(1.1rem, 4vw, 1.5rem); 
            font-weight: 700;
            color: #ccfbf1;
            margin-bottom: 5px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 1px 2px 4px rgba(0,0,0,0.3);
        }

        .title-line2 {
            font-size: clamp(1.4rem, 5.5vw, 2.6rem); 
            font-weight: 900;
            background: linear-gradient(to right, #2dd4bf, #0f766e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.5));
            line-height: 1.3;
            text-align: center;
        }

        .header-main h2 { font-size: clamp(1rem, 3vw, 1.3rem); font-weight: 600; color: #f0fdfa; margin-bottom: 8px; text-shadow: 1px 1px 2px rgba(0,0,0,0.3);}
        .header-main p { font-size: clamp(0.9rem, 2.5vw, 1.1rem); font-weight: 600; background: rgba(0,0,0,0.3); display: inline-block; padding: 6px 20px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 4px 6px rgba(0,0,0,0.1);}

        .header-wave {
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: auto;
            z-index: 1;
        }

        /* --- الأزرار --- */
        .btn {
            background: linear-gradient(to bottom, var(--primary-light), var(--primary));
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-bottom: 3px solid rgba(0,0,0,0.3);
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.2); }
        .btn:active { transform: translateY(2px); border-bottom: 0px; margin-top: 3px; }
        .btn-correct { filter: brightness(1.2); pointer-events: none; border-bottom-width: 0; transform: translateY(2px);}
        .btn-wrong { filter: brightness(0.8); pointer-events: none; border-bottom-width: 0; transform: translateY(2px);}

        /* --- الشاشة الرئيسية --- */
        #home-screen {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .grid-menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1000px;
            padding-bottom: 80px;
        }

        .menu-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05), 0 4px 6px -2px rgba(0,0,0,0.025);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
        }
        .menu-card::before {
            content: ""; position: absolute; top: 0; left: 0; right: 0; height: 6px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            opacity: 0; transition: opacity 0.3s;
        }
        .menu-card:hover { transform: translateY(-8px); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); border-color: rgba(34, 197, 94, 0.25); }
        .menu-card:hover::before { opacity: 1; }
        
        .menu-card .icon-container {
            width: 80px; height: 80px;
            margin: 0 auto 15px auto;
            background: linear-gradient(135deg, #ccfbf1, #99f6e4);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: inset 0 3px 6px rgba(255,255,255,0.8), 0 4px 8px rgba(0,0,0,0.05);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .menu-card .icon-container svg {
            width: 40px; height: 40px; stroke: #134e4a; fill: none;
            stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
        }
        .menu-card:hover .icon-container { transform: scale(1.1) rotate(10deg); }
        .menu-card h3 { font-size: 1.4rem; color: var(--dark); font-weight: 800; margin-bottom: 8px;}
        .menu-card p { font-size: 1rem; color: #64748b; font-weight: 600;}

        /* --- شاشة اللعب --- */
        #game-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .game-nav {
            background: white;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: clamp(0.9rem, 3vw, 1.2rem);
        }
        .back-btn { background: #e2e8f0; color: var(--dark); border-bottom: 3px solid #cbd5e1; padding: 8px 15px;}
        #game-progress { background: #0d9488; color: white; padding: 6px 15px; border-radius: 20px;}
        
        .game-container {
            flex: 1;
            padding: 0 20px 40px 20px;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .question-box {
            background: white;
            padding: 20px 25px;
            border-radius: 16px;
            text-align: center;
            font-size: clamp(1.2rem, 4vw, 1.6rem);
            font-weight: 800;
            color: #134e4a;
            margin-bottom: 25px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
            border-right: 8px solid #0e7490;
            line-height: 1.6;
        }

        .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        /* MCQ Style */
        .options-grid { display: flex; flex-direction: column; gap: 15px; }
        .options-grid .btn { padding: 18px; font-size: clamp(1.1rem, 3.5vw, 1.4rem); text-align: right; justify-content: flex-start; border-radius: 12px;}

        /* True/False Style */
        .tf-grid { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }

        /* Bubbles Style */
        .bubbles-area {
            position: relative; height: 400px;
            background: linear-gradient(to bottom, #042f2e, #134e4a);
            border-radius: 16px; overflow: hidden;
            border: 4px solid #0d9488; margin-top: 10px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        .bubble {
            position: absolute;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), rgba(224,231,255,0.9));
            color: #134e4a;
            border: 2px solid #ffffff;
            padding: 10px 5px;
            border-radius: 30px;
            font-weight: 800; font-size: clamp(0.85rem, 2vw, 1.05rem);
            box-shadow: 0 10px 15px rgba(0,0,0,0.2), inset -4px -4px 10px rgba(0,0,0,0.1);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            text-align: center;
            width: 22%;
            transition: transform 0.2s, background 0.2s;
            z-index: 5;
        }
        .bubble:hover { transform: scale(1.05); }
        .bubble::after {
            content: ''; position: absolute; top: 10%; left: 15%;
            width: 20%; height: 20%; background: rgba(255,255,255,0.8);
            border-radius: 50%; filter: blur(2px);
        }

        /* Shooting Style */
        .shooting-area {
            position: relative; height: 400px; background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><rect fill="%23e0fbfc" width="100%" height="100%"/><circle fill="%23bae6fd" cx="20%" cy="30%" r="50"/><circle fill="%23bae6fd" cx="80%" cy="60%" r="70"/><circle fill="%23bae6fd" cx="50%" cy="80%" r="40"/></svg>') no-repeat center center;
            background-size: cover; border-radius: 16px; overflow: hidden;
            border: 4px solid #0d9488; margin-top: 10px; box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
        }
        .target-bird {
            position: absolute; background: white; color: var(--dark);
            padding: 10px 20px; border-radius: 30px; font-weight: 800; font-size: clamp(0.95rem, 3vw, 1.15rem);
            box-shadow: 0 8px 15px rgba(0,0,0,0.15); cursor: crosshair;
            border: 3px solid var(--warning); white-space: nowrap; transition: background 0.2s;
            display: flex; align-items: center; gap: 8px;
        }
        .target-bird:hover { transform: scale(1.05); background: #f0fdfa; }

        /* Genius Challenge Style */
        .genius-wrap {
            background: linear-gradient(135deg, #042f2e, #134e4a, #0f766e);
            border-radius: 16px; padding: 20px; margin-top: 10px;
            border: 4px solid #2dd4bf; box-shadow: inset 0 0 25px rgba(0,0,0,0.4), 0 10px 20px rgba(21,128,61,0.35);
        }
        .genius-timer-track {
            width: 100%; height: 14px; background: rgba(0,0,0,0.35);
            border-radius: 10px; overflow: hidden; margin-bottom: 18px;
            border: 2px solid rgba(255,255,255,0.2);
        }
        .genius-timer-bar {
            height: 100%; width: 100%;
            background: linear-gradient(to right, #2dd4bf, #0d9488, #ef4444);
            border-radius: 10px;
            transition: width 0.1s linear;
        }
        .genius-options { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        @media (max-width: 600px) { .genius-options { grid-template-columns: 1fr; } }
        .genius-options .btn {
            padding: 16px 10px; font-size: clamp(1rem, 3vw, 1.25rem);
            background: linear-gradient(to bottom, #14b8a6, #0f766e);
            border-bottom: 3px solid #134e4a; border-radius: 14px; min-height: 70px;
        }
        .genius-badge {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(74, 222, 128, 0.15); color: #2dd4bf;
            font-weight: 800; padding: 6px 16px; border-radius: 20px;
            border: 1px solid rgba(253,224,71,0.4); margin-bottom: 12px; font-size: 0.95rem;
        }

        /* Result Share (WhatsApp) */
        .share-box {
            margin-top: 25px; background: #f0fdfa; border: 2px solid #99f6e4;
            border-radius: 16px; padding: 20px; text-align: center;
        }
        .share-box h4 { color: #115e59; font-size: 1.2rem; margin-bottom: 12px; font-weight: 800;}
        .share-name-input {
            width: 100%; max-width: 320px; padding: 12px 16px; border-radius: 12px;
            border: 2px solid #5eead4; font-size: 1.05rem; text-align: center;
            font-family: 'Cairo', sans-serif; font-weight: 700; margin-bottom: 12px;
            color: var(--dark);
        }
        .share-name-input:focus { outline: none; border-color: #0d9488; }
        .btn-share {
            background: linear-gradient(to bottom, #25d366, #1da851);
            border-bottom-color: #128c3e; display: inline-flex; gap: 10px;
        }
        .share-warning { color: var(--danger); font-weight: 700; font-size: 0.9rem; margin-top: 8px; display: none; }

        /* Modal Overlay */
        .overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(4px);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .overlay.active { opacity: 1; pointer-events: all; }
        .modal {
            background: white; padding: 40px; border-radius: 25px;
            text-align: center; max-width: 90%; width: 400px;
            transform: scale(0.7) translateY(50px); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
        }
        .overlay.active .modal { transform: scale(1) translateY(0); }
        .modal-icon { display: flex; justify-content: center; margin-bottom: 20px; }

        /* Summary Errors Scrolling */
        .errors-list::-webkit-scrollbar { width: 8px; }
        .errors-list::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }
        .errors-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
        .errors-list::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* الفوتر (Footer) */
        .footer-main {
            background: var(--dark); color: #cbd5e1;
            text-align: center; padding: 25px 20px; margin-top: auto;
            border-top: 4px solid var(--primary);
        }
        .footer-main p { margin: 5px 0; font-size: 1.1rem; font-weight: 600;}
        .footer-main .designer { font-size: 1rem; color: #94a3b8; font-weight: 400;}

        /* WhatsApp */
        .whatsapp-float {
            position: fixed; bottom: 25px; left: 25px;
            background: #25d366; color: white;
            width: 65px; height: 65px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            text-decoration: none; box-shadow: 0 8px 15px rgba(37, 211, 102, 0.4);
            z-index: 100; transition: all 0.3s;
        }
        .whatsapp-float:hover { transform: scale(1.15) rotate(-5deg); box-shadow: 0 12px 20px rgba(37, 211, 102, 0.6); }
        .whatsapp-float svg { width: 35px; height: 35px; fill: currentColor; }

        /* Confetti effect */
        .confetti {
            position: fixed; top: -10px; width: 12px; height: 12px; z-index: 9999;
            animation: fall linear forwards; border-radius: 3px;
        }
        @keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: 0; } }

        /* Goals (تسجيل الأهداف) Style */
        .pitch {
            position: relative; height: 320px; margin-top: 10px; border-radius: 16px; overflow: hidden;
            border: 4px solid #0d9488; box-shadow: inset 0 0 25px rgba(0,0,0,0.35);
            background: repeating-linear-gradient(to bottom, #15803d 0px, #15803d 40px, #16a34a 40px, #16a34a 80px);
        }
        .pitch::before { /* منطقة الجزاء */
            content: ""; position: absolute; left: 8%; right: 8%; top: 0; height: 200px;
            border: 3px solid rgba(255,255,255,0.75); border-top: none; border-radius: 0 0 10px 10px;
        }
        .pitch::after { /* نقطة الجزاء */
            content: ""; position: absolute; left: 50%; bottom: 52px; width: 10px; height: 10px;
            background: rgba(255,255,255,0.85); border-radius: 50%; transform: translateX(-50%);
        }
        .goal-frame {
            position: absolute; left: 15%; right: 15%; top: 14px; height: 120px; z-index: 1;
            border: 7px solid #ffffff; border-bottom: none; border-radius: 6px 6px 0 0;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
            background:
                repeating-linear-gradient(0deg, rgba(255,255,255,0.35) 0 2px, transparent 2px 14px),
                repeating-linear-gradient(90deg, rgba(255,255,255,0.35) 0 2px, transparent 2px 14px),
                rgba(4,47,46,0.35);
        }
        .goal-frame.net-shake { animation: netShake 0.5s ease; }
        @keyframes netShake {
            0%,100% { transform: scale(1); } 30% { transform: scale(1.04, 1.07); } 60% { transform: scale(0.98); }
        }
        .keeper {
            position: absolute; left: 50%; top: 58px; width: 64px; height: 82px; z-index: 3;
            transform: translateX(-50%); transition: left 0.45s ease-out, transform 0.45s ease-out;
        }
        .keeper.idle { animation: keeperSway 1.6s ease-in-out infinite alternate; }
        @keyframes keeperSway { from { margin-left: -45px; } to { margin-left: 45px; } }
        .keeper svg { width: 100%; height: 100%; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.35)); }
        .soccer-ball {
            position: absolute; left: 50%; top: 250px; width: 46px; height: 46px; z-index: 4;
            font-size: 42px; line-height: 46px; text-align: center;
            transform: translate(-50%, 0) scale(1); filter: drop-shadow(0 6px 4px rgba(0,0,0,0.4));
            transition: left 0.6s cubic-bezier(.2,.8,.3,1), top 0.6s cubic-bezier(.2,.8,.3,1), transform 0.6s ease;
        }
        .goal-banner {
            position: absolute; left: 50%; top: 50%; z-index: 6; transform: translate(-50%, -50%) scale(0.4);
            background: rgba(255,255,255,0.96); color: var(--primary); font-weight: 900;
            font-size: clamp(1.4rem, 5vw, 2.2rem); padding: 10px 28px; border-radius: 40px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.35); opacity: 0; transition: all 0.3s cubic-bezier(.17,.89,.32,1.27);
            white-space: nowrap; pointer-events: none;
        }
        .goal-banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .goal-banner.miss { color: var(--danger); }
        .shot-options { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; }
        @media (max-width: 600px) { .shot-options { grid-template-columns: 1fr; } }
        .shot-options .btn {
            padding: 14px 12px; font-size: clamp(1rem, 3vw, 1.2rem); min-height: 64px; border-radius: 14px;
            background: linear-gradient(to bottom, #16a34a, #15803d); border-bottom: 3px solid #14532d;
            justify-content: flex-start; text-align: right;
        }
        .shot-options .btn .ball-ico { font-size: 1.3rem; flex-shrink: 0; }
    </style>
</head>
<body>

    <!-- الهيدر مع اللوجو -->
    <header class="header-main" id="main-header">
        <div class="header-content">
            <div style="display: flex; align-items: center; justify-content: center; gap: 40px; flex-wrap: wrap;">
                <!-- اللوجو (على اليمين) -->
                <img src="logo.jpg" alt="شعار الأستاذ كَرِيم بَكْر" style="width: 260px; height: 260px; border-radius: 30px; border: 4px solid var(--warning); box-shadow: 0 8px 16px rgba(0,0,0,0.4); background-color: white; object-fit: cover; flex-shrink: 0;">
                
                <!-- النصوص -->
                <div style="display: flex; flex-direction: column; align-items: center; text-align: center;">
                    <h1 class="title-line1">
                        درس 
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg>
                        لعبة
                    </h1>
                    <h1 class="title-line2">مع الأستاذ كَرِيم بَكْر</h1>
                    <h2>الصَّفُّ الْأَوَّلُ الثَّانَوِيُّ - الْفَصْلُ الدِّرَاسِيُّ الْأَوَّلُ - كَادَ وَأَخَوَاتُهَا</h2>
                    <p style="margin-top: 10px;">القَوَاعِدُ النَّحْوِيَّةُ</p>
                </div>
            </div>
        </div>
        <!-- تموجات زخرفية -->
        <svg class="header-wave" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320">
            <path fill="#ecfeff" fill-opacity="1" d="M0,192L48,197.3C96,203,192,213,288,229.3C384,245,480,267,576,250.7C672,235,768,181,864,170.7C960,160,1056,192,1152,208C1248,224,1344,224,1392,224L1440,224L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
        </svg>
    </header>

    <!-- الشاشة الرئيسية -->
    <div id="home-screen">
        <div class="grid-menu" id="menu-grid">
            <!-- سيتم حقن البطاقات هنا برمجياً -->
        </div>
    </div>

    <!-- شاشة اللعب -->
    <div id="game-screen" class="hidden">

    // --- محرك الصوت للمؤثرات التفاعلية ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new AudioContext();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playTone(freq, type, duration, vol = 0.1) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    function playCorrect() {
        initAudio();
        playTone(523.25, 'sine', 0.1, 0.1); 
        setTimeout(() => playTone(659.25, 'sine', 0.1, 0.1), 100); 
        setTimeout(() => playTone(783.99, 'sine', 0.2, 0.15), 200); 
        setTimeout(() => playTone(1046.50, 'sine', 0.4, 0.2), 300); 
        triggerConfetti();
    }

    function playWrong() {
        initAudio();
        playTone(300, 'sawtooth', 0.15, 0.1);
        setTimeout(() => playTone(200, 'sawtooth', 0.25, 0.15), 150);
        
        const qBox = document.querySelector('.question-box');
        if(qBox) {
            qBox.classList.remove('shake');
            void qBox.offsetWidth; 
            qBox.classList.add('shake');
        }
    }

    // --- مؤثرات بصرية ---
    function triggerConfetti() {
        const colors = ['#f72585', '#4cc9f0', '#fee440', '#00f5d4', '#8b5cf6'];
        for(let i=0; i<40; i++) {
            let conf = document.createElement('div');
            conf.className = 'confetti';
            conf.style.left = Math.random() * 100 + 'vw';
            conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            conf.style.animationDuration = (Math.random() * 2 + 1) + 's';
            document.body.appendChild(conf);
            setTimeout(() => conf.remove(), 3000);
        }
    }

    function shuffleArray(arr) {
        return arr.map(a => ({sort: Math.random(), value: a}))
            .sort((a, b) => a.sort - b.sort)
            .map(a => a.value);
    }

    function sendResultToTeacher(score, total) {
        const nameInput = document.getElementById('student-name-input');
        const warning = document.getElementById('share-warning');
        const name = nameInput.value.trim();
        if (!name) {
            warning.style.display = 'block';
            nameInput.classList.add('shake');
            nameInput.focus();
            setTimeout(() => nameInput.classList.remove('shake'), 500);
            return;
        }
        warning.style.display = 'none';
        const gameTitle = currentGame ? currentGame.title : '';
        const message =
            `📚 نتيجة طالب - ${LESSON_NAME}\n` +
            `👤 اسم الطالب: ${name}\n` +
            `🎮 اللعبة: ${gameTitle}\n` +
            `✅ النتيجة: ${score} من ${total}\n` +
            `⭐ نسبة النجاح: ${Math.round((score/total)*100)}%`;
        const url = `https://wa.me/201033621345?text=${encodeURIComponent(message)}`;
        window.open(url, '_blank');
    }

    function startGame(gameData) {
        initAudio();
        currentGame = gameData;
        currentQuestions = shuffleArray([...gameData.questions]);
        qIndex = 0;
        wrongAnswers = []; // تصفير قائمة الأخطاء
        
        document.getElementById('home-screen').classList.add('hidden');
        document.getElementById('main-header').classList.add('hidden');
        document.getElementById('main-footer').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('game-title').innerText = gameData.title;
        
        renderNextState();
    }

    function renderNextState() {
        if (qIndex >= currentQuestions.length) {
            gameComplete();
            return;
        }

        const gc = document.getElementById('game-container');
        gc.innerHTML = '';
        updateProgress();

        if (currentGame.type === 'goals') {
            renderGoals(gc);
        } else if (currentGame.type === 'mcq') {
            renderMCQ(gc);
        } else if (currentGame.type === 'bubbles') {
            renderBubbles(gc);
        } else if (currentGame.type === 'shooting') {
            renderShooting(gc);
        } else if (currentGame.type === 'true_false') {
            renderTrueFalse(gc);
        } else if (currentGame.type === 'genius') {
            renderGenius(gc);
        }
    }

    // --- أنماط الألعاب ---

    // 1. اختيارات (MCQ)
    function renderMCQ(container) {
        clearInterval(geniusTimerInterval);
        const qData = currentQuestions[qIndex];
        const correctText = qData.options[qData.ans];
        const shuffledOptions = shuffleArray([...qData.options]);

        const btnContainer = document.createElement('div');
        btnContainer.className = 'options-grid';
        
        let isAnswered = false;

        shuffledOptions.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = opt;
            btn.onclick = () => {
                if(isAnswered) return;
                isAnswered = true;

                if (opt === correctText) {
                    btn.classList.add('btn-correct');
                    showFeedback(true, () => { qIndex++; renderNextState(); });
                } else {
                    btn.classList.add('btn-wrong');
                    wrongAnswers.push({ question: qData.q, correct: correctText, selected: opt });
                    showFeedback(false, () => { qIndex++; renderNextState(); });
                }
            };
            btnContainer.appendChild(btn);
        });

        const qBox = document.createElement('div');
        qBox.className = 'question-box';
        qBox.innerText = qData.q;
        
        container.appendChild(qBox);
        container.appendChild(btnContainer);
    }

    function renderTrueFalse(container) {
        clearInterval(geniusTimerInterval);
        const qData = currentQuestions[qIndex];
        const correctText = qData.options[qData.ans];

        qBox.className = 'question-box';

        tfContainer.className = 'tf-grid';
        
        let isAnswered = false;

        // ترتيب ثابت (صح يميناً وخطأ يساراً)
        const fixedOptions = ["صح", "خطأ"];

        fixedOptions.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.style.flex = '1';
            btn.style.minWidth = '200px';
            btn.style.fontSize = '2rem';
            btn.style.padding = '30px';
            btn.style.justifyContent = 'center';
            
            if(opt === "صح") {
                btn.style.background = "linear-gradient(to bottom, #10b981, #0e7490)";
                btn.style.borderBottomColor = "#047857";
            } else {
                btn.style.background = "linear-gradient(to bottom, #ef4444, #dc2626)";
                btn.style.borderBottomColor = "#b91c1c";
            }

            btn.innerText = opt;
            
            btn.onclick = () => {
                if(isAnswered) return;
                isAnswered = true;

                if (opt === correctText) {
                    btn.classList.add('btn-correct');
                    showFeedback(true, () => { qIndex++; renderNextState(); });
                } else {
                    btn.classList.add('btn-wrong');
                    wrongAnswers.push({ question: qData.q, correct: correctText, selected: opt });
                    showFeedback(false, () => { qIndex++; renderNextState(); });
                }
            };
            tfContainer.appendChild(btn);
        });

        container.appendChild(qBox);
        container.appendChild(tfContainer);
    }

    // 5. تحدي العباقرة (سؤال بعدّاد زمني)
    function renderGenius(container) {
        clearInterval(animInterval); clearInterval(geniusTimerInterval);
        clearInterval(geniusTimerInterval);
        const qData = currentQuestions[qIndex];
        const correctText = qData.options[qData.ans];
        const shuffledOptions = shuffleArray([...qData.options]);

        const wrap = document.createElement('div');
        wrap.className = 'genius-wrap';

        const badge = document.createElement('div');
        badge.className = 'genius-badge';
        badge.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.663 17h4.673M12 3a6 6 0 0 0-6 6c0 1.887.454 2.921 1.5 4.5.5.75 1 1.5 1 2.5h7c0-1 .5-1.75 1-2.5C17.546 11.921 18 10.887 18 9a6 6 0 0 0-6-6z"></path></svg> تحدي العباقرة`;

        const timerTrack = document.createElement('div');
        timerTrack.className = 'genius-timer-track';
        const timerBar = document.createElement('div');
        timerBar.className = 'genius-timer-bar';
        timerTrack.appendChild(timerBar);

        const qBox = document.createElement('div');
        qBox.className = 'question-box';
        qBox.style.background = 'rgba(255,255,255,0.95)';
        qBox.innerText = qData.q;

        const optContainer = document.createElement('div');
        optContainer.className = 'genius-options';

        let isAnswered = false;
        const TOTAL_TIME = 12000; // 12 ثانية لكل سؤال
        let startTime = Date.now();

        function finishQuestion(isCorrect, selectedText) {
            if (isAnswered) return;
            isAnswered = true;
            clearInterval(geniusTimerInterval);
            if (!isCorrect) {
                wrongAnswers.push({ question: qData.q, correct: correctText, selected: selectedText || "انتهى الوقت!" });
            }
            showFeedback(isCorrect, () => { qIndex++; renderNextState(); });
        }

        shuffledOptions.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = opt;
            btn.onclick = () => {
                if (isAnswered) return;
                if (opt === correctText) {
                    btn.classList.add('btn-correct');
                    finishQuestion(true, opt);
                } else {
                    btn.classList.add('btn-wrong');
                    finishQuestion(false, opt);
                }
            };
            optContainer.appendChild(btn);
        });

        wrap.appendChild(badge);
        wrap.appendChild(timerTrack);
        container.appendChild(wrap);
        container.appendChild(qBox);
        container.appendChild(optContainer);

        geniusTimerInterval = setInterval(() => {
            if (isAnswered) { clearInterval(geniusTimerInterval); return; }
            const elapsed = Date.now() - startTime;
            const pct = Math.max(0, 100 - (elapsed / TOTAL_TIME) * 100);
            timerBar.style.width = pct + '%';
            if (elapsed >= TOTAL_TIME) {
                clearInterval(geniusTimerInterval);
                finishQuestion(false, null);
            }
        }, 80);
    }


    // 6. تسجيل الأهداف (سدّد الكرة نحو الإجابة الصحيحة)
    let goalTimeouts = [];
    function renderGoals(container) {
        clearInterval(animInterval); clearInterval(geniusTimerInterval);
        goalTimeouts.forEach(t => clearTimeout(t)); goalTimeouts = [];
        const qData = currentQuestions[qIndex];
        const correctText = qData.options[qData.ans];
        const shuffledOptions = shuffleArray([...qData.options]);

        const qBox = document.createElement('div');
        qBox.className = 'question-box';
        qBox.innerText = qData.q;

        const pitch = document.createElement('div');
        pitch.className = 'pitch';
        pitch.innerHTML = `
            <div class="goal-frame"></div>
            <div class="keeper idle">
                <svg viewBox="0 0 64 82" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="32" cy="12" r="10" fill="#fcd9b6" stroke="#7c2d12" stroke-width="1.5"/>
                    <path d="M22 9 Q32 -1 42 9" fill="#1e293b"/>
                    <rect x="20" y="23" width="24" height="30" rx="7" fill="#f97316" stroke="#9a3412" stroke-width="1.5"/>
                    <text x="32" y="44" font-size="13" font-weight="900" text-anchor="middle" fill="#fff" font-family="Cairo, sans-serif">1</text>
                    <path d="M20 27 L4 14" stroke="#f97316" stroke-width="7" stroke-linecap="round"/>
                    <path d="M44 27 L60 14" stroke="#f97316" stroke-width="7" stroke-linecap="round"/>
                    <circle cx="4" cy="13" r="5.5" fill="#facc15" stroke="#a16207" stroke-width="1.5"/>
                    <circle cx="60" cy="13" r="5.5" fill="#facc15" stroke="#a16207" stroke-width="1.5"/>
                    <rect x="22" y="52" width="20" height="10" rx="3" fill="#1e293b"/>
                    <path d="M26 62 L24 79" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
                    <path d="M38 62 L40 79" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
                </svg>
            </div>
            <div class="soccer-ball">⚽</div>
            <div class="goal-banner"></div>
        `;

        const optContainer = document.createElement('div');
        optContainer.className = 'shot-options';

        // مواقع التسديد داخل المرمى (يمين أعلى، يسار أعلى، يمين أسفل، يسار أسفل)
        const targets = [
            { left: 74, top: 40 }, { left: 26, top: 40 },
            { left: 74, top: 95 }, { left: 26, top: 95 }
        ];

        let isAnswered = false;
        const keeper = pitch.querySelector('.keeper');
        const ball = pitch.querySelector('.soccer-ball');
        const goalFrame = pitch.querySelector('.goal-frame');
        const banner = pitch.querySelector('.goal-banner');

        shuffledOptions.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerHTML = `<span class="ball-ico">⚽</span><span></span>`;
            btn.lastChild.innerText = opt;
            btn.onclick = () => {
                if (isAnswered) return;
                isAnswered = true;
                const isCorrect = (opt === correctText);
                btn.classList.add(isCorrect ? 'btn-correct' : 'btn-wrong');
                const t = targets[index];

                // تسديد الكرة
                ball.style.left = t.left + '%';
                ball.style.top = (t.top - 14) + 'px';
                ball.style.transform = 'translate(-50%, 0) scale(0.6) rotate(540deg)';

                // حركة الحارس
                keeper.classList.remove('idle');
                keeper.style.marginLeft = '0px';
                if (isCorrect) {
                    const wrongSide = t.left > 50 ? 26 : 74;
                    keeper.style.left = wrongSide + '%';
                    keeper.style.transform = `translateX(-50%) rotate(${t.left > 50 ? -70 : 70}deg)`;
                } else {
                    keeper.style.left = t.left + '%';
                    keeper.style.transform = `translateX(-50%) rotate(${t.left > 50 ? 70 : -70}deg)`;
                }

                goalTimeouts.push(setTimeout(() => {
                    if (isCorrect) {
                        goalFrame.classList.add('net-shake');
                        banner.textContent = '⚽ هدف!';
                        banner.classList.remove('miss');
                    } else {
                        // الحارس يبعد الكرة
                        ball.style.top = '200px';
                        ball.style.left = (t.left > 50 ? 92 : 8) + '%';
                        banner.textContent = '🧤 تصدّى الحارس!';
                        banner.classList.add('miss');
                        wrongAnswers.push({ question: qData.q, correct: correctText, selected: opt });
                    }
                    banner.classList.add('show');
                }, 620));

                goalTimeouts.push(setTimeout(() => {
                    showFeedback(isCorrect, () => { qIndex++; renderNextState(); });
                }, 1350));
            };
            optContainer.appendChild(btn);
        });

        container.appendChild(qBox);
        container.appendChild(pitch);
        container.appendChild(optContainer);

        let hint = document.createElement('div');
        hint.style.textAlign = 'center';
        hint.style.marginTop = '15px';
        hint.style.color = 'var(--primary)';
        hint.style.fontWeight = 'bold';
        hint.style.fontSize = '1.1rem';
        hint.innerHTML = `⚽ اختر الإجابة الصحيحة لتسدد الكرة في المرمى وتسجّل هدفًا!`;
        container.appendChild(hint);
    }

    // 3. الفقاعات المتساقطة
    function renderBubbles(container) {
        clearInterval(animInterval); clearInterval(geniusTimerInterval);
        const qData = currentQuestions[qIndex];
        const correctText = qData.options[qData.ans];
        const shuffledOptions = shuffleArray([...qData.options]);

        const qBox = document.createElement('div');
        qBox.className = 'question-box';
        qBox.innerText = qData.q;
        
        const area = document.createElement('div');
        area.className = 'bubbles-area';

        let bubbles = [];
        let isAnswered = false;

        shuffledOptions.forEach((opt, index) => {
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerHTML = `<span>${opt}</span>`;
            
            let leftPos = 2 + (index * 24); 
            bubble.style.left = leftPos + '%';
            
            let topPos = -100 - (Math.random() * 80);
            bubble.style.top = topPos + 'px';
            
            let speed = 0.95 + Math.random() * 0.65; 

            bubble.onclick = () => {
                if (isAnswered) return;
                isAnswered = true;
                clearInterval(animInterval); clearInterval(geniusTimerInterval);
                if (opt === correctText) {
                    bubble.style.background = 'var(--success)';
                    bubble.style.color = 'white';
                    showFeedback(true, () => { qIndex++; renderNextState(); });
                } else {
                    bubble.style.background = 'var(--danger)';
                    bubble.style.color = 'white';
                    wrongAnswers.push({ question: qData.q, correct: correctText, selected: opt });
                    showFeedback(false, () => { qIndex++; renderNextState(); });
                }
            };

            area.appendChild(bubble);
            bubbles.push({ el: bubble, top: topPos, speed: speed, isCorrect: opt === correctText, active: true });
        });

        container.appendChild(qBox);
        container.appendChild(area);
        
        let hint = document.createElement('div');
        hint.style.textAlign = 'center';
        hint.style.marginTop = '15px';
        hint.style.color = 'var(--primary)';
        hint.style.fontWeight = 'bold';
        hint.style.fontSize = '1.1rem';
        hint.innerHTML = `💡 اضغط على الفقاعة التي تحمل الإجابة الصحيحة قبل أن تسقط!`;
        container.appendChild(hint);

        let areaHeight = 400;

        animInterval = setInterval(() => {
            if (isAnswered) return;
            bubbles.forEach(b => {
                if (!b.active) return;
                b.top += b.speed;
                b.el.style.top = b.top + 'px';
                
                b.el.style.transform = `translateX(${Math.sin(b.top / 20) * 5}px)`;

                if (b.top > areaHeight) {
                    b.active = false;
                    b.el.style.display = 'none';
                    if (b.isCorrect && !isAnswered) {
                        isAnswered = true;
                        clearInterval(animInterval); clearInterval(geniusTimerInterval);
                        wrongAnswers.push({ question: qData.q, correct: correctText, selected: "سقطت دون اختيار" });
                        showFeedback(false, () => { qIndex++; renderNextState(); });
                    }
                }
            });
        }, 30);
    }

    // 4. التنشين
    function renderShooting(container) {
        clearInterval(animInterval); clearInterval(geniusTimerInterval);
        const qData = currentQuestions[qIndex];
        const correctText = qData.options[qData.ans];
        const shuffledOptions = shuffleArray([...qData.options]);

        const qBox = document.createElement('div');
        qBox.className = 'question-box';
        qBox.innerText = qData.q;
        
        const area = document.createElement('div');
        area.className = 'shooting-area';

        let isAnswered = false;

        shuffledOptions.forEach((opt, index) => {
            const bird = document.createElement('div');
            bird.className = 'target-bird';
            
            bird.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg> <span>${opt}</span>`;
            
            let topPos = 15 + (index * 20); 
            bird.style.top = topPos + '%';
            
            let pos = (index % 2 === 0) ? -200 : window.innerWidth;
            let speed = (Math.random() * 2.5 + 1.5) * ((index % 2 === 0) ? 1 : -1);
            
            bird.style.left = pos + 'px';

            bird.onclick = () => {
                if(isAnswered) return;
                isAnswered = true;

                if (opt === correctText) {
                    bird.style.background = 'var(--success)';
                    bird.style.color = 'white';
                    bird.style.borderColor = 'white';
                    showFeedback(true, () => { qIndex++; renderNextState(); });
                } else {
                    bird.style.background = 'var(--danger)';
                    bird.style.color = 'white';
                    bird.style.borderColor = 'white';
                    wrongAnswers.push({ question: qData.q, correct: correctText, selected: opt });
                    showFeedback(false, () => { qIndex++; renderNextState(); });
                }
            };

            area.appendChild(bird);

            animInterval = setInterval(() => {
                if (isAnswered) return;
                pos += speed;
                if (pos > window.innerWidth + 50) pos = -250;
                if (pos < -250) pos = window.innerWidth + 50;
                bird.style.left = pos + 'px';
            }, 20);
        });

        container.appendChild(qBox);
        container.appendChild(area);
        
        let hint = document.createElement('div');
        hint.style.textAlign = 'center';
        hint.style.marginTop = '15px';
        hint.style.color = 'var(--primary)';
        hint.style.fontWeight = 'bold';
        hint.style.fontSize = '1.1rem';
        hint.style.display = 'flex';
        hint.style.alignItems = 'center';
        hint.style.justifyContent = 'center';
        hint.style.gap = '8px';
        hint.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg> اضغط على الإجابة الصحيحة وهي تتحرك لاصطيادها!`;
        container.appendChild(hint);
    }

    window.onload = initApp;
</script>
</body>
</html>
